<svg xmlns="http://www.w3.org/2000/svg" width="121" height="36" viewBox="0 0 121.1 36.0" role="img" aria-label="@entisone">
  <title>@entisone</title>
  <style>text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }</style>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="gloss" x1="-0.5" y1="0" x2="-0.1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
      <animate attributeName="x1" from="-0.5" to="1.1" begin="0.5s" dur="1.4s" fill="freeze"/><animate attributeName="x2" from="-0.1" to="1.5" begin="0.5s" dur="1.4s" fill="freeze"/>
    </linearGradient>
    <filter id="g" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="pill">
      <rect x="1" y="1" width="119.1" height="34.0" rx="17.0"/>
    </clipPath>
  </defs>
  <g opacity="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.1667;1" dur="0.600s" begin="0s" fill="freeze"/>
    <rect x="1" y="1" width="119.1" height="34.0"
          rx="17.0" fill="#a78bfa" opacity="0.18"
          filter="url(#g)"/>
    <rect x="1" y="1" width="119.1" height="34.0"
          rx="17.0" fill="#131029" stroke="url(#edge)"
          stroke-width="1.4"/>
    <rect clip-path="url(#pill)" x="1" y="1" width="119.1"
          height="34.0" fill="url(#gloss)"/>
    <g transform="translate(13.0 10.5) scale(0.6250)"
       fill="none" stroke="#a78bfa" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 19c-4 1.4-4-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 4.5-1.4 4.5-5a4 4 0 0 0-1.1-2.8 3.7 3.7 0 0 0-.1-2.8s-1.2-.4-3.8 1.4a9.4 9.4 0 0 0-5 0C7.3 3.7 6.1 4.1 6.1 4.1a3.7 3.7 0 0 0-.1 2.8A4 4 0 0 0 5 9.7c0 3.6 1.7 4.7 4.5 5-.6.6-.6 1.2-.5 2V20"/>
    </g>
    <text x="37.0" y="22.9"
          font-size="13.5" font-weight="600"
          fill="#e2e8f0">@entisone</text>
  </g>
